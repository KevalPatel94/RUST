[package]
name = "user_domain"
version = "0.1.0"
edition = "2021"

[dependencies]
# User data crate for repository
user_data = { path = "../user_data" }
# Domain common infrastructure
domain_common = { path = "../domain_common" }
# Repository common for error types
repository_common = { path = "../repository_common" }
# Network for error types in tests
network = { path = "../network" }
# Async trait support
async-trait = "0.1"
# Error handling
thiserror = "1.0"
# UniFFI for FFI bindings
uniffi = { version = "0.30.0" }

[build-dependencies]
uniffi = { version = "0.30.0", features = ["build"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
