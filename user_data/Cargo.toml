[package]
name = "user_data"
version = "0.1.0"
edition = "2021"

[dependencies]
# Network crate for HTTP client
network = { path = "../network" }
# Repository common helpers
repository_common = { path = "../repository_common" }
# Async trait support
async-trait = "0.1"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
