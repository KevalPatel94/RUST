[package]
name = "domain_common"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime for UseCase execution
# rt-multi-thread: multi-threaded runtime (Runtime::new())
tokio = { version = "1", features = ["rt-multi-thread"] }
# Error handling
thiserror = "1.0"
# UniFFI for error types exposed to platforms
uniffi = { version = "0.30.0" }
