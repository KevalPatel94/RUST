name: Example
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 15.0.0
    BUNDLE_DISPLAY_NAME: LockSmith
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.0.1
    TARGETED_DEVICE_FAMILY: 1,2
    SWIFT_VERSION: 5.10
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    GENERATE_INFOPLIST_FILE: YES
options:
  minimumXcodeGenVersion: 2.42.0
  bundleIdPrefix: com.venmo
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
packages:
  LockSmith:
    path: .
  RxSwift:
    url: https://github.com/ReactiveX/RxSwift.git
    from: 6.7.1
targets:
  LockSmithExample:
    type: application
    platform: iOS
    dependencies:
      - package: LockSmith
        product: Calculator
      - package: RxSwift
        product: RxSwift
      - package: RxSwift
        product: RxCocoa
    settings:
      base:	
        REEXPORTED_FRAMEWORK_NAMES: ""	
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"	
        CURRENT_PROJECT_VERSION: 1	
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    scheme:
      commandLineArguments:
          "-Test": true
      gatherCoverageData: true
      testTargets:
        - name: LockSmithExampleUITests
    sources:
      - Sources/LockSmithExample
    info:
      path: "Sources/LockSmithExample/Resources/Info.plist"
      properties:
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - armv7
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
  LockSmithAllTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - package: LockSmith
        product: Calculator
    scheme:
      environmentVariables:
        PACKAGE_RESOURCE_BUNDLE_URL: $(TARGET_BUILD_DIR)
      gatherCoverageData: true
      testTargets:
        - package: LockSmith/LockSmithTests
          parallelizable: true
          randomExecutionOrder: true
  LockSmithExampleTests:
    type: bundle.unit-test
    platform: iOS
    dependencies:
      - target: LockSmithExample
      - package: LockSmith
        product: Calculator
    sources:
      - path: Tests/LockSmithExampleTests
    info:
      path: "Tests/LockSmithExampleTests/Resources/Info.plist"
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: 6.0
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: 1.0
        CFBundleVersion: 1
  LockSmithExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    dependencies:
      - target: LockSmithExample
    sources:
      - path: Tests/LockSmithExampleUITests
    info:
      path: "Tests/LockSmithExampleUITests/Resources/Info.plist"
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: 6.0
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: 1.0
        CFBundleVersion: 1
