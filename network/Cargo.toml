[package]
name = "network"
version = "0.1.0"
edition = "2021"
description = "Network crate for making API calls, reusable across Android and iOS platforms"
license = "MIT"

[dependencies]
# Async HTTP client
# Disable default features (cookies, gzip, brotli, etc.) to reduce size
# Enable minimal features needed: native-tls (TLS + HTTP/1.1), json (JSON parsing)
# Note: native-tls includes HTTP/1.1 support. We avoid http2, gzip, brotli, cookies to save size
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
# Async runtime - minimal features
# rt-multi-thread: reqwest needs multi-threaded runtime
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# Async trait support
async-trait = "0.1"
# Error handling
thiserror = "1.0"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# URL handling
url = "2.5"

